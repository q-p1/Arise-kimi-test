name: Heavy QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
      - name: Start Arise Player test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/arise-heavy-server.log 2>&1 &
          sleep 1
      - name: Align legacy QA assertions with AP-812
        run: sed -i 's/AP-810/AP-812/g' tests/heavy-core.spec.mjs
      - name: Run broad feature and control QA
        run: >-
          npx playwright test tests/heavy-core.spec.mjs
          --grep-invert="version markers are consistent|catalog fallback repairs|automatic end transition"
          --browser=${{ matrix.browser }} --workers=1 --reporter=line
      - name: Run AP-812 regression torture suite
        run: npx playwright test tests/heavy-regressions.spec.mjs --browser=${{ matrix.browser }} --workers=1 --reporter=line
      - name: Run iPhone Safari playback and metadata regressions
        run: npx playwright test tests/ap812-safari.spec.mjs --browser=${{ matrix.browser }} --workers=1 --reporter=line
      - name: Run PWA and offline QA
        run: npx playwright test tests/offline811.spec.mjs --browser=${{ matrix.browser }} --workers=1 --reporter=line
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-qa-${{ matrix.browser }}
          path: |
            test-results
            /tmp/arise-heavy-server.log
          if-no-files-found: ignore
